<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#123b66">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="トラック日報">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>トラック日報 Pro</title>
<style>
:root{--navy:#123b66;--blue:#1769aa;--bg:#f2f5f8;--green:#16834b;--orange:#c56b16}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;color:#172433;padding-bottom:env(safe-area-inset-bottom)}
header{background:var(--navy);color:white;padding:18px 18px 22px;padding-top:calc(18px + env(safe-area-inset-top));border-radius:0 0 22px 22px}
h1{font-size:21px;margin:0 0 6px}.date{font-size:13px;opacity:.85}
main{padding:15px;max-width:680px;margin:auto}.status{display:flex;gap:8px;margin:0 0 14px}.pill{background:white;border-radius:30px;padding:8px 12px;font-size:12px;box-shadow:0 2px 8px #10203010}.pill b{color:var(--green)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.action{border:0;border-radius:15px;background:white;padding:17px 10px;min-height:86px;text-align:left;box-shadow:0 3px 12px #1020300c;color:#172433;font-size:15px;font-weight:700}.action small{display:block;color:#718093;font-weight:400;margin-top:7px}.action.primary{background:var(--blue);color:white}.action.primary small{color:#dbeeff}
.card{background:white;border-radius:16px;padding:16px;margin-top:14px;box-shadow:0 3px 12px #1020300c}.card h2{font-size:16px;margin:0 0 12px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.big{font-size:25px;font-weight:750}.muted{color:#718093;font-size:12px}
button,input,select{font:inherit}button.secondary,.export{border:1px solid #d7e0e8;background:white;border-radius:10px;padding:10px 13px;color:var(--navy);font-weight:650}
input,select{width:100%;border:1px solid #d7e0e8;border-radius:10px;padding:12px;background:#fff;margin:5px 0 10px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px}.quick button{border:1px solid #d7e0e8;background:#fff;border-radius:10px;padding:12px 6px;color:#21384e}
.entry{padding:11px 0;border-bottom:1px solid #edf0f3;display:flex;gap:12px}.entry:last-child{border:0}.time{font-size:12px;color:#718093;min-width:58px}.entry strong{font-size:14px}.entry p{font-size:12px;color:#718093;margin:3px 0 0;white-space:pre-wrap}
footer{text-align:center;color:#8190a0;font-size:11px;padding:20px 10px}
.notice{background:#fff7e9;border:1px solid #f0d8ae;color:#76501b;padding:11px;border-radius:12px;font-size:12px;line-height:1.55;margin-top:14px}
</style>
</head>
<body>
<header><h1>🚚 トラック日報 Pro</h1><div class="date" id="today"></div></header>
<main>
<div class="status">
 <div class="pill">勤務 <b id="dutyState">OFF</b></div>
 <div class="pill">運行 <b id="driveState">OFF</b></div>
 <div class="pill">GPS <b id="gpsState">停止</b></div>
</div>
<div class="grid">
 <button class="action primary" id="dutyBtn">▶ 出勤<small>タップして勤務開始</small></button>
 <button class="action" id="driveBtn">🚛 運行開始<small>運行の開始・終了を記録</small></button>
</div>
<section class="card">
 <h2>GPS走行記録</h2>
 <div class="row"><div><div class="big" id="distance">0.00 km</div><div class="muted" id="gpsHint">記録停止中</div></div><button class="secondary" id="gpsBtn">GPS記録開始</button></div>
 <p class="muted">位置情報はGPS記録中のみ取得します。距離は概算です。</p>
</section>
<section class="card">
 <h2>作業記録を追加</h2>
 <label class="muted" for="memo">メモ（場所・荷物など）</label><input id="memo" placeholder="例：長野営業所で積込">
 <label class="muted" for="odo">メーター距離 km（任意）</label><input id="odo" type="number" inputmode="decimal" placeholder="例：123456.7">
 <div class="quick" id="quick"></div>
</section>
<section class="card">
 <div class="row"><h2>今日の記録</h2><button class="export" id="csvBtn">CSV出力</button></div>
 <div id="entries"><p class="muted">まだ記録はありません。</p></div>
</section>
<section class="card">
 <h2>データ管理</h2>
 <div class="row"><span class="muted">記録はこのiPhone内に保存します</span><button class="secondary" id="backupBtn">バックアップ</button></div>
 <input type="file" id="restoreFile" accept="application/json" hidden>
 <button class="secondary" id="restoreBtn">バックアップから復元</button>
</section>
<div class="notice">安全上の注意：走行中は操作しないでください。必ず安全な場所に停車して入力してください。これは個人用の記録補助アプリです。会社指定の帳票や法定の運行・労務管理システムの代替にはなりません。アルコール確認は結果の手入力記録であり、検知器との連携はありません。</div>
</main>
<footer>トラック日報 Pro · 個人用オフライン記録</footer>
<script>
const KEY='truckNippoPwa_v1';
let data=JSON.parse(localStorage.getItem(KEY)||'{"entries":[],"duty":false,"drive":false,"distance":0}');
let gpsWatch=null,lastPos=null;
const $=id=>document.getElementById(id);
const todayKey=()=>new Date().toLocaleDateString('ja-JP');
function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function add(type){
 const entry={time:new Date().toISOString(),type,note:$('memo').value.trim(),odo:$('odo').value?Number($('odo').value):null,lat:null,lon:null};
 if(lastPos){entry.lat=lastPos.coords.latitude;entry.lon=lastPos.coords.longitude}
 data.entries.unshift(entry);$('memo').value='';$('odo').value='';save();
}
const quickItems=['点呼','アルコール確認','荷積み','荷下ろし','休憩開始','休憩終了','給油','車両点検'];
quickItems.forEach(x=>{let b=document.createElement('button');b.textContent=x;b.onclick=()=>add(x);$('quick').append(b)});
function render(){
 $('today').textContent=new Date().toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'short'});
 $('dutyState').textContent=data.duty?'ON':'OFF';$('driveState').textContent=data.drive?'ON':'OFF';
 $('dutyBtn').innerHTML=(data.duty?'■ 退勤':'▶ 出勤')+'<small>'+(data.duty?'タップして勤務終了':'タップして勤務開始')+'</small>';
 $('driveBtn').innerHTML=(data.drive?'■ 運行終了':'🚛 運行開始')+'<small>運行の開始・終了を記録</small>';
 $('distance').textContent=data.distance.toFixed(2)+' km';
 const todays=data.entries.filter(e=>new Date(e.time).toLocaleDateString('ja-JP')===todayKey());
 $('entries').innerHTML=todays.length?'':'<p class="muted">まだ記録はありません。</p>';
 todays.forEach(e=>{let d=document.createElement('div');d.className='entry';let t=document.createElement('div');t.className='time';t.textContent=new Date(e.time).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});let body=document.createElement('div');let s=document.createElement('strong');s.textContent=e.type;let p=document.createElement('p');p.textContent=[e.note,e.odo!=null?'メーター '+e.odo+' km':'',e.lat!=null?'GPS位置記録済み':''].filter(Boolean).join(' · ');body.append(s,p);d.append(t,body);$('entries').append(d)});
}
$('dutyBtn').onclick=()=>{data.duty=!data.duty;add(data.duty?'出勤':'退勤');};
$('driveBtn').onclick=()=>{data.drive=!data.drive;add(data.drive?'運行開始':'運行終了');};
$('gpsBtn').onclick=()=>{
 if(gpsWatch!==null){navigator.geolocation.clearWatch(gpsWatch);gpsWatch=null;lastPos=null;$('gpsState').textContent='停止';$('gpsHint').textContent='記録停止中';$('gpsBtn').textContent='GPS記録開始';add('GPS記録終了');return}
 if(!('geolocation'in navigator)){alert('この環境ではGPSを利用できません。');return}
 $('gpsBtn').textContent='GPS準備中…';
 gpsWatch=navigator.geolocation.watchPosition(pos=>{
  if(lastPos){let R=6371000,rad=x=>x*Math.PI/180, a=lastPos.coords,b=pos.coords;let dLat=rad(b.latitude-a.latitude),dLon=rad(b.longitude-a.longitude);let h=Math.sin(dLat/2)**2+Math.cos(rad(a.latitude))*Math.cos(rad(b.latitude))*Math.sin(dLon/2)**2;let meters=2*R*Math.asin(Math.sqrt(h));if(meters>5&&meters<3000)data.distance+=meters/1000}
  lastPos=pos;$('gpsState').textContent='記録中';$('gpsHint').textContent='最終更新 '+new Date().toLocaleTimeString('ja-JP');$('distance').textContent=data.distance.toFixed(2)+' km';$('gpsBtn').textContent='GPS記録停止';localStorage.setItem(KEY,JSON.stringify(data));
 },err=>{alert('位置情報を取得できません。Safariの位置情報許可とHTTPS接続を確認してください。');navigator.geolocation.clearWatch(gpsWatch);gpsWatch=null;$('gpsBtn').textContent='GPS記録開始'}, {enableHighAccuracy:true,maximumAge:5000,timeout:15000});
};
$('csvBtn').onclick=()=>{
 const rows=[['日時','項目','メモ','メーターkm','緯度','経度'],...data.entries.filter(e=>new Date(e.time).toLocaleDateString('ja-JP')===todayKey()).slice().reverse().map(e=>[new Date(e.time).toLocaleString('ja-JP'),e.type,e.note,e.odo??'',e.lat??'',e.lon??''])];
 const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n');download(new Blob([csv],{type:'text/csv;charset=utf-8'}),'truck-nippo-'+new Date().toISOString().slice(0,10)+'.csv');
};
function download(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();URL.revokeObjectURL(a.href)}
$('backupBtn').onclick=()=>download(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),'truck-nippo-backup.json');
$('restoreBtn').onclick=()=>$('restoreFile').click();
$('restoreFile').onchange=async e=>{try{let obj=JSON.parse(await e.target.files[0].text());if(!Array.isArray(obj.entries))throw 0;data=obj;save();alert('復元しました')}catch{alert('バックアップファイルを読み込めませんでした')}};
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
render();
</script>
</body></html>
